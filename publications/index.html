<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publications | Levent Kırca</title>
  <meta name="description" content="Publications of Levent Kırca.">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <h1>Publications</h1>
    <p class="pub-count" id="pub-count"></p>

      <select id="pub-typefilter"><option value="">All Types</option></select>
    </div>
    <ul class="pub-list" id="pub-list"></ul>
  </main>

  <div id="site-footer"></div>
  <script src="/assets/site.js"></script>
  <script src="/assets/publications.js"></script>
</body>
</html>
